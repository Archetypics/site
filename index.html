<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Archetypics Creative Lab</title>
    <meta name="description" content="Archetypics Creative Lab — Sobre jogos e pessoas">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f3efe8;
            color: #3b302d;
            font-family: Georgia, "Times New Roman", serif;
        }

        header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 45px;
        }

        .logo {
            display: block;
        }

        .logo img {
            width: 110px;
            height: auto;
            display: block;
        }

        nav {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        nav a {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #6d625e;
            text-decoration: none;
        }

        nav a:hover {
            color: #722f3f;
        }

        main {
            min-height: calc(100vh - 110px);
            width: min(90%, 700px);
            margin: 0 auto;
            padding: 100px 30px 60px;
            text-align: center;
        }

        .subtitle {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #6d625e;
            margin-bottom: 55px;
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 2.7rem);
            font-weight: normal;
            margin-bottom: 22px;
        }

        .intro {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #5c514d;
            margin-bottom: 38px;
        }

        .construction {
            display: inline-block;
            border-top: 1px solid #722f3f;
            border-bottom: 1px solid #722f3f;
            padding: 12px 24px;
            color: #722f3f;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin-bottom: 45px;
        }

        .instagram {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.95rem;
            color: #6d625e;
        }

        .instagram a {
            color: #722f3f;
            text-decoration: none;
            font-weight: bold;
        }

        .instagram a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 60px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.75rem;
            color: #8b817c;
            letter-spacing: 0.05em;
        }

        @media (max-width: 650px) {
            header {
                padding: 22px 25px;
                flex-direction: column;
                gap: 22px;
            }

            .logo img {
                width: 165px;
            }

            nav {
                gap: 22px;
            }

            main {
                padding-top: 60px;
            }
        }
    </style>
</head>

<body>

    <header>

        <a class="logo" href="index.html" aria-label="Archetypics — página principal">
            <img src="Logomarca vinho.png" alt="Archetypics">
        </a>

        <nav>
            <a href="index.html">Principal</a>
            <a href="jogos.html">Jogos</a>
            <a href="contato.html">Contato</a>
        </nav>

    </header>

    <main>

        <div class="subtitle">
            Creative Lab
        </div>

        <h1>Sobre jogos e pessoas</h1>

        <p class="intro">
            Um laboratório independente dedicado à criação de jogos,
            ideias e experiências.
        </p>

        <div class="construction">
            Em construção
        </div>

        <div class="instagram">
            Acompanhe a Archetypics no
            <a href="https://www.instagram.com/archetypics/" target="_blank" rel="noopener noreferrer">
                Instagram
            </a>
        </div>

        <footer>
            © 2026 Archetypics Creative Lab
        </footer>

    </main>

</body>
</html>
