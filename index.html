<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Archetypics Creative Lab</title>
    <meta name="description" content="Archetypics Creative Lab — Sobre jogos e pessoas.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3efe8;
            color: #3b302d;
            font-family: Georgia, "Times New Roman", serif;
            text-align: center;
        }

        main {
            width: min(90%, 700px);
            padding: 60px 30px;
        }

        .brand {
            font-size: clamp(2.4rem, 7vw, 4.5rem);
            letter-spacing: 0.08em;
            font-weight: normal;
            color: #722f3f;
            margin-bottom: 12px;
        }

        .subtitle {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #6d625e;
            margin-bottom: 55px;
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 2.7rem);
            font-weight: normal;
            margin-bottom: 22px;
        }

        .intro {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #5c514d;
            margin-bottom: 38px;
        }

        .construction {
            display: inline-block;
            border-top: 1px solid #722f3f;
            border-bottom: 1px solid #722f3f;
            padding: 12px 24px;
            color: #722f3f;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin-bottom: 45px;
        }

        .instagram {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.95rem;
            color: #6d625e;
        }

        .instagram a {
            color: #722f3f;
            text-decoration: none;
            font-weight: bold;
        }

        .instagram a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 60px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.75rem;
            color: #8b817c;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body>

    <main>

        <div class="brand">Archetypics</div>

        <div class="subtitle">
            Creative Lab
        </div>

        <h1>Sobre jogos e pessoas.</h1>

        <p class="intro">
            Um laboratório independente dedicado à criação de jogos,
            ideias e experiências.
        </p>

        <div class="construction">
            Em construção
        </div>

        <div class="instagram">
            Acompanhe a Archetypics no
            <a href="https://www.instagram.com/archetypics/" target="_blank">
                Instagram
            </a>
        </div>

        <footer>
            © 2026 Archetypics Creative Lab
        </footer>

    </main>

</body>
</html>
