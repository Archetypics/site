<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Archetypics Creative Lab</title>
    <meta name="description" content="Archetypics Creative Lab — Sobre jogos e pessoas">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f3efe8;
            color: #3b302d;
            font-family: Georgia, "Times New Roman", serif;
        }

        header {
            width: 100%;
            height: 240px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 50px;
            background: #f3efe8;
        }

        .logo {
            display: block;
        }

        .logo img {
            width: 100px;
            height: 100px;
            display: block;
            object-fit: contain;
        }

        nav {
            display: flex;
            gap: 48px;
            padding-top: 62px;
            padding-right: 10px;
        }

        nav a {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #6d625e;
            text-decoration: none;
        }

        nav a:hover {
            color: #722f3f;
        }

        main {
            min-height: calc(100vh - 240px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 95px 30px 50px;
        }

        .brand {
            font-size: clamp(2.4rem, 6vw, 4.2rem);
            letter-spacing: 0.08em;
            font-weight: normal;
            color: #722f3f;
            margin-bottom: 14px;
        }

        .subtitle {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #6d625e;
            margin-bottom: 70px;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: normal;
            margin-bottom: 28px;
        }

        .intro {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #5c514d;
            margin-bottom: 50px;
            max-width: 900px;
        }

        .construction {
            display: inline-block;
            border-top: 1px solid #722f3f;
            border-bottom: 1px solid #722f3f;
            padding: 14px 34px;
            color: #722f3f;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin-bottom: 62px;
        }

        .instagram {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.95rem;
            color: #6d625e;
        }

        .instagram a {
            color: #722f3f;
            text-decoration: none;
            font-weight: bold;
        }

        .instagram a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 60px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.75rem;
            color: #8b817c;
            letter-spacing: 0.05em;
        }

        @media (max-width: 700px) {

            header {
                height: auto;
                padding: 25px;
                align-items: center;
            }

            .logo img {
                width: 85px;
                height: 85px;
            }

            nav {
                gap: 18px;
                padding-top: 0;
                padding-right: 0;
            }

            nav a {
                font-size: 0.7rem;
                letter-spacing: 0.12em;
            }

            main {
                min-height: calc(100vh - 135px);
                padding: 70px 20px 40px;
            }

            .brand {
                font-size: 2.4rem;
            }

            .subtitle {
                margin-bottom: 50px;
            }

            h1 {
                font-size: 2rem;
            }

            .intro {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <header>

        <a href="index.html" class="logo" aria-label="Página principal">
            <img src="Logomarca%20vinho.png" alt="Archetypics">
        </a>

        <nav>
            <a href="index.html">Principal</a>
            <a href="jogos.html">Jogos</a>
            <a href="contato.html">Contato</a>
        </nav>

    </header>

    <main>

        <div class="brand">
            Archetypics
        </div>

        <div class="subtitle">
            Creative Lab
        </div>

        <h1>
            Sobre jogos e pessoas
        </h1>

        <p class="intro">
            Um laboratório independente dedicado à criação de jogos,
            ideias e experiências.
        </p>

        <div class="construction">
            Em construção
        </div>

        <div class="instagram">
            Acompanhe a Archetypics no
            <a href="https://www.instagram.com/archetypics/" target="_blank">
                Instagram
            </a>
        </div>

        <footer>
            © 2026 Archetypics Creative Lab
        </footer>

    </main>

</body>
</html>
